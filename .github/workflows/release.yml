name: Release APK

# Signed release builds on a 16 GB GitHub runner instead of the 8 GB dev machine.
#
# - Tag pushes build, sign, and publish a GitHub release.
# - Manual runs always upload the APK as an artifact; only tags publish.
# - Unit tests are deliberately NOT run here: .github/workflows/android.yml already
#   runs them on every push and pull request, and repeating them would roughly
#   double the wall-clock time of a release build.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64            base64 of keystore/locker-release.jks
#   KEYSTORE_STORE_PASSWORD    store password
#   KEY_ALIAS                  key alias
#   KEY_KEY_PASSWORD           key password

on:
  workflow_dispatch:
    inputs:
      minify:
        description: "Build with R8 enabled (smaller APK; test on a device before using it as a release)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

# A newer run for the same ref makes the older one pointless.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_KEY_PASSWORD: ${{ secrets.KEY_KEY_PASSWORD }}
      MINIFY: ${{ inputs.minify == true && 'true' || 'false' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies, the wrapper, and the build cache between runs.
      # From the second run on this is what turns a 10 minute build into ~2.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore signing material
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/locker-release.jks
          printf 'storeFile=keystore/locker-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_STORE_PASSWORD" "$KEY_ALIAS" "$KEY_KEY_PASSWORD" > keystore.properties
          chmod 600 keystore.properties

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -PlockerMinifyRelease="$MINIFY"

      - name: Fail if a release tag is unsigned
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Refusing to publish an unsigned release. Add the KEYSTORE_* secrets first."
          exit 1

      - name: Read version and hash the APK
        id: package
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          APK=app/build/outputs/apk/release/app-release.apk
          # A run without signing secrets produces an unsigned artifact.
          [ -f "$APK" ] || APK=app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$APK" "Locker-${VERSION}-release.apk"
          SHA=$(sha256sum "Locker-${VERSION}-release.apk" | cut -d' ' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Read signing certificate
        id: cert
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "Locker-${{ steps.package.outputs.version }}-release.apk" 2>/dev/null \
            | grep -i 'SHA-256 digest' | head -1 | awk -F': ' '{print $2}')
          echo "cert=${CERT:-unsigned}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locker-${{ steps.package.outputs.version }}-release
          path: Locker-${{ steps.package.outputs.version }}-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > notes.md <<EOF
          Locker ${{ steps.package.outputs.version }}

          Built from commit ${{ github.sha }} by GitHub Actions.

          APK SHA-256: \`${{ steps.package.outputs.sha }}\`
          Signing certificate SHA-256: \`${{ steps.cert.outputs.cert }}\`
          Minified (R8): ${{ env.MINIFY }}

          Verify a download with:
          \`sha256sum Locker-${{ steps.package.outputs.version }}-release.apk\`
          EOF

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "Locker-${{ steps.package.outputs.version }}-release.apk" \
            --title "Locker ${{ steps.package.outputs.version }}" \
            --notes-file notes.md
